<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Deadline Tracker</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
        text-align: center;
    }

    form {
        display: grid;
        gap: 10px;
        margin-bottom: 25px;
    }

    input, button {
        padding: 12px;
        font-size: 16px;
    }

    button {
        background-color: #333;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }

    button:hover {
        background-color: #555;
    }

    .deadline-card {
        border: 1px solid #ddd;
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
    }

    .deadline-card h3 {
        margin: 0 0 8px;
    }

    .delete-btn {
        background-color: #d9534f;
        margin-top: 10px;
    }
</style>
```

</head>

<body>

```
<div class="container">

    <h1>Class Deadline Tracker</h1>

    <form id="deadlineForm">

        <input
            type="text"
            id="subject"
            placeholder="Subject"
            required
        >

        <input
            type="text"
            id="task"
            placeholder="Assignment / Task"
            required
        >

        <input
            type="date"
            id="deadline"
            required
        >

        <button type="submit">
            Add Deadline
        </button>

    </form>

    <h2>Upcoming Deadlines</h2>

    <div id="deadlineList"></div>

</div>


<script>

    const form = document.getElementById("deadlineForm");

    const deadlineList =
        document.getElementById("deadlineList");

    let deadlines =
        JSON.parse(localStorage.getItem("deadlines")) || [];


    function displayDeadlines() {

        deadlineList.innerHTML = "";

        deadlines.sort(function(a, b) {

            return new Date(a.deadline)
                - new Date(b.deadline);

        });


        if (deadlines.length === 0) {

            deadlineList.innerHTML =
                "<p>No deadlines added yet.</p>";

            return;
        }


        deadlines.forEach(function(item, index) {

            const card =
                document.createElement("div");

            card.className = "deadline-card";


            card.innerHTML = `

                <h3>${item.subject}</h3>

                <p>
                    <strong>Task:</strong>
                    ${item.task}
                </p>

                <p>
                    <strong>Deadline:</strong>
                    ${item.deadline}
                </p>

                <button
                    class="delete-btn"
                    onclick="deleteDeadline(${index})">

                    Delete

                </button>

            `;


            deadlineList.appendChild(card);

        });

    }


    form.addEventListener("submit", function(event) {

        event.preventDefault();


        const subject =
            document.getElementById("subject").value;

        const task =
            document.getElementById("task").value;

        const deadline =
            document.getElementById("deadline").value;


        deadlines.push({

            subject: subject,

            task: task,

            deadline: deadline

        });


        localStorage.setItem(

            "deadlines",

            JSON.stringify(deadlines)

        );


        form.reset();

        displayDeadlines();

    });


    function deleteDeadline(index) {

        deadlines.splice(index, 1);


        localStorage.setItem(

            "deadlines",

            JSON.stringify(deadlines)

        );


        displayDeadlines();

    }


    displayDeadlines();

</script>
```

</body>
</html>
